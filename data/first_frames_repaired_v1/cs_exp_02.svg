<svg xmlns="http://www.w3.org/2000/svg" width="832" height="480" viewBox="0 0 832 480"><rect width="832" height="480" fill="#f8fbff"/><text x="42" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#15324a">Stack: last in, first out (LIFO)</text><rect x="40" y="103" width="752" height="305" rx="12" fill="#ffffff" stroke="#aac6d9" stroke-width="2"/><text x="71" y="146" font-family="Arial" font-size="22" font-weight="bold" text-anchor="start" fill="#183249">Push order</text><text x="71" y="189" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#1b7197">A  →  B  →  C</text><text x="71" y="273" font-family="Arial" font-size="22" font-weight="bold" text-anchor="start" fill="#183249">Pop order</text><text x="71" y="317" font-family="Arial" font-size="28" font-weight="bold" text-anchor="start" fill="#a74c40">C  →  B  →  A</text><line x1="500" y1="171" x2="500" y2="368" stroke="#28546d" stroke-width="5" stroke-linecap="round"/><line x1="714" y1="171" x2="714" y2="368" stroke="#28546d" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="368" x2="714" y2="368" stroke="#28546d" stroke-width="5" stroke-linecap="round"/><rect x="523" y="315" width="168" height="44" rx="6" fill="#dff0f9" stroke="#5a9fc1" stroke-width="2"/><text x="607" y="345" font-family="Arial" font-size="26" font-weight="normal" text-anchor="middle" fill="#183249">A</text><rect x="523" y="260" width="168" height="44" rx="6" fill="#dff0f9" stroke="#5a9fc1" stroke-width="2"/><text x="607" y="290" font-family="Arial" font-size="26" font-weight="normal" text-anchor="middle" fill="#183249">B</text><rect x="523" y="205" width="168" height="44" rx="6" fill="#dff0f9" stroke="#5a9fc1" stroke-width="2"/><text x="607" y="235" font-family="Arial" font-size="26" font-weight="normal" text-anchor="middle" fill="#183249">C</text><line x1="563" y1="144" x2="563" y2="192" stroke="#2b8b73" stroke-width="5" stroke-linecap="round"/><polygon points="563,192 555.7,180.1 570.3,180