<svg xmlns="http://www.w3.org/2000/svg" width="832" height="480" viewBox="0 0 832 480"><rect width="832" height="480" fill="#f8fbff"/><text x="42" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#15324a">Balanced methane combustion</text><rect x="38" y="104" width="756" height="300" rx="12" fill="#ffffff" stroke="#aac6d9" stroke-width="2"/><text x="70" y="144" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#183249">Reactants</text><text x="518" y="144" font-family="Arial" font-size="23" font-weight="bold" text-anchor="start" fill="#183249">Products</text><circle cx="130" cy="234" r="43" fill="#d9e4ee" stroke="#52708b" stroke-width="2"/><text x="130" y="243" font-family="Arial" font-size="25" font-weight="normal" text-anchor="middle" fill="#183249">CH4</text><text x="189" y="243" font-family="Arial" font-size="30" font-weight="normal" text-anchor="start" fill="#183249">+</text><circle cx="255" cy="234" r="35" fill="#ffe0df" stroke="#d45b52" stroke-width="2"/><text x="255" y="242" font-family="Arial" font-size="25" font-weight="normal" text-anchor="middle" fill="#183249">O2</text><circle cx="335" cy="234" r="35" fill="#ffe0df" stroke="#d45b52" stroke-width="2"/><text x="335" y="242" font-family="Arial" font-size="25" font-weight="normal" text-anchor="middle" fill="#183249">O2</text><line x1="393" y1="232" x2="492" y2="232" stroke="#e45745" stroke-width="5" stroke-linecap="round"/><polygon points="492,232 480.1,239.3 480.1,224.7" fill="#e45745"/><circle cx="553" cy="234" r="40" fill="#e5ebf0" stroke="#6d8297" stroke-width="2"/><text x="553" y="243" font-family="Arial" font-size="24" font-weight="normal" text-anchor="middle" fill="#183249">CO2</text><text x="605" y="243" font-family="Arial" font-size="30" font-weight="normal" text-anchor="start" fill="#183249">+</text><circle cx="660" cy="234" r="34" fill="#dcefff" stroke="#6ba4c9" stroke-width="2"/><text x="660" y="242" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#183249">H2O</text><circle cx="741" cy="234" r="34" fill="#dcefff" stroke="#6ba4c9" stroke-width="2"/><text x="741" y="242" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#183249">H2O</text><text x="416" y="340" font-family="Arial" font-size="29" font-weight="bold" text-anchor="middle" fill="#163953">CH4 + 2 O2  →  CO2 + 2 H2O</text><text x="416" y="377" font-family="Arial" font-size="18" font-weight="normal" text-anchor="middle" fill="#3a6578">C: 1 = 1     H: 4 = 4     O: 4 = 4</text></svg>